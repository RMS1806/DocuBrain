version: '3.8'

# Load environment variables from .env file
# All secrets live in .env — do NOT hard-code credentials here.

services:

  # ─────────────────────────────────────────
  # 4. THE MEMORY (Database)
  # ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: docubrain_db
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────
  # 5. THE POST OFFICE (Message Broker)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docubrain_redis
    restart: on-failure
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ─────────────────────────────────────────
  # 6. THE WAREHOUSE (Object Storage)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: docubrain_minio
    restart: on-failure
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # MinIO exposes a /minio/health/live endpoint
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s



  # ─────────────────────────────────────────
  # 7. THE BOUNCER (Connection Pooler)
  # ─────────────────────────────────────────
  # edoburu/pgbouncer auto-generates pgbouncer.ini + userlist.txt from env vars.
  # The backend connects to pgbouncer:5432 — NOT directly to db:5432.
  # PgBouncer maintains a small pool of real Postgres connections and multiplexes
  # all app connections onto them, keeping Postgres's connection count low.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: docubrain_pgbouncer
    restart: on-failure
    ports:
      - "5433:5432"     # Exposed as 5433 locally so you can still reach Postgres directly on 5432
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 10
      MIN_POOL_SIZE: 2
      RESERVE_POOL_SIZE: 3
      SERVER_IDLE_TIMEOUT: 600
      QUERY_TIMEOUT: 30
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ─────────────────────────────────────────
  # 8. THE GATEKEEPER (Reverse Proxy)
  # ─────────────────────────────────────────
  # Nginx is the ONLY service that exposes ports to the host network.
  # Everything else (backend, db, redis) is on Docker's internal network only.
  # This is the correct security posture — only the reverse proxy is internet-facing.
  nginx:
    image: nginx:alpine
    container_name: docubrain_nginx
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"   # Unused in dev; ready for production TLS
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro   # :ro = read-only mount
      # Uncomment for production TLS (after running certbot):
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─────────────────────────────────────────
  # 1. THE BRAIN (API)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: docubrain_backend
    restart: on-failure
    # No ports exposed to host — all traffic enters through Nginx.
    # The backend is only reachable via Docker's internal network.
    volumes:
      - ./backend:/code
    # Only start AFTER every dependency is actually healthy
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer/${POSTGRES_DB}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer/${POSTGRES_DB}
      READ_REPLICA_URL: ${READ_REPLICA_URL:-}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      S3_ENDPOINT: minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

  # ─────────────────────────────────────────
  # 2. THE MUSCLE (Async Worker)
  # ─────────────────────────────────────────
  worker:
    build:
      context: ./backend
    container_name: docubrain_worker
    restart: on-failure
    command: celery -A app.docubrain_tasks worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/code
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer/${POSTGRES_DB}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      S3_ENDPOINT: minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

  # ─────────────────────────────────────────
  # 3. THE FACE (Frontend)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: docubrain_frontend
    restart: on-failure
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      WATCHPACK_POLLING: "true"
      VITE_API_URL: http://localhost   # Traffic goes through Nginx on port 80

# ─────────────────────────────────────────
# PERSISTENT STORAGE VOLUMES
# ─────────────────────────────────────────
volumes:
  postgres_data:
  minio_data: