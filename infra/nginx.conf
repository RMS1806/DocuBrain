# ──────────────────────────────────────────────────────────────────────────────
# DocuBrain — Nginx Reverse Proxy Configuration
#
# Traffic flow (dev):
#   Browser → Nginx :80 → backend :8000 (FastAPI/uvicorn, inside Docker network)
#
# Traffic flow (production, after uncommenting the HTTPS block below):
#   Browser → Nginx :443 (TLS terminated here) → backend :8000
#              Nginx :80  → redirect to :443
#
# Nginx responsibilities:
#   1. TLS termination   — decrypt HTTPS once here; plain HTTP inside Docker
#   2. Rate limiting     — coarse IP-level throttling before Python ever wakes up
#   3. Load balancing    — distribute across backend workers (least_conn)
#   4. Client buffering  — free FastAPI workers from slow client connections
#   5. Gzip compression  — compress JSON ~75% before sending to client
#   6. IP forwarding     — inject X-Forwarded-For so FastAPI sees real client IP
#   7. WebSocket upgrade — handle HTTP→WS upgrade handshake transparently
#   8. /metrics guard    — block Prometheus endpoint from public internet
# ──────────────────────────────────────────────────────────────────────────────


# worker_processes: how many Nginx worker processes to spawn.
# "auto" = one per CPU core on the host machine.
# Unlike Python, Nginx workers are event-driven (not threaded) — one process
# can hold thousands of simultaneous connections using Linux's epoll system call.
worker_processes auto;

# pid: where Nginx writes its master process ID.
# Needed by OS init systems (systemd) for clean shutdown.
pid /var/run/nginx.pid;


events {
    # Maximum simultaneous connections each worker process will accept.
    # Total concurrent connections = worker_processes × worker_connections.
    # 1024 is conservative; a dedicated proxy server might use 4096+.
    worker_connections 1024;

    # epoll: Linux's scalable I/O event notification mechanism.
    # Instead of polling every file descriptor to see if it's ready (O(n)),
    # epoll notifies Nginx only when a descriptor becomes readable/writable (O(1)).
    # This is why Nginx can hold 10,000 connections in one process.
    use epoll;

    # multi_accept on: when a new connection arrives, accept ALL pending
    # connections in one go rather than one at a time. Better under burst load.
    multi_accept on;
}


http {

    # ── MIME types ────────────────────────────────────────────────────────────
    # Tell browsers what kind of data each file extension contains.
    # Without this, browsers guess — which can cause security issues.
    include      /etc/nginx/mime.types;
    default_type application/json;   # Our API always speaks JSON


    # ── Structured access logging ─────────────────────────────────────────────
    # Match our JSON logging philosophy from Phase 3 so Loki/Datadog can ingest
    # Nginx logs the same way as FastAPI logs.
    #
    # Key fields:
    #   $request_time          — total time (receive first byte → send last byte)
    #   $upstream_response_time — time FastAPI took (subtract from request_time
    #                              to get client-side network delay)
    #   $upstream_addr         — which backend worker handled it (shows load balance)
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"upstream":"$upstream_addr",'
            '"client_ip":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log  warn;


    # ── TCP performance ───────────────────────────────────────────────────────
    # sendfile on: use the kernel sendfile() syscall to move file data
    # directly disk→socket, bypassing user-space buffers. Fast for static files.
    sendfile on;

    # tcp_nopush: batch multiple write() calls into one TCP packet (Nagle's algo).
    # Works with sendfile to reduce packet count for large responses.
    tcp_nopush on;

    # tcp_nodelay: for keepalive connections, disable batching and send small
    # packets immediately. Reduces latency for interactive APIs and WebSockets.
    tcp_nodelay on;

    # keepalive_timeout: how long (seconds) to hold an idle client connection
    # open, waiting for another request. Saves the TCP 3-way handshake overhead
    # for browsers that fire multiple API calls per page load.
    keepalive_timeout 65;

    # server_tokens off: don't include "nginx/1.x.x" in error pages or headers.
    # Hiding the version makes it harder for attackers to look up known CVEs.
    server_tokens off;


    # ── Gzip compression ──────────────────────────────────────────────────────
    # JSON is text — it compresses extremely well (70-80% reduction is typical).
    # A 50KB analytics response becomes ~10KB before being sent to the browser.
    gzip on;

    # gzip_vary: add "Vary: Accept-Encoding" response header.
    # This tells CDNs and caches that the response differs based on whether
    # the client supports gzip — so they cache both the compressed and
    # uncompressed versions separately.
    gzip_vary on;

    # gzip_proxied any: compress responses that came from an upstream server.
    # Without this, Nginx only compresses direct file responses, not proxied ones.
    gzip_proxied any;

    # gzip_comp_level: 1 (fastest, least compression) to 9 (slowest, best).
    # Level 6 is the well-established sweet spot — diminishing returns above it.
    gzip_comp_level 6;

    # gzip_min_length: don't compress responses smaller than this.
    # Compressing a 200-byte response adds more overhead than it saves.
    gzip_min_length 1024;

    # gzip_types: which Content-Type responses to compress.
    # text/html is already compressed by default.
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml;


    # ── Rate limiting zones ───────────────────────────────────────────────────
    # A "zone" is a shared memory region that all Nginx worker processes use
    # to share per-IP request counters. Workers are separate processes — without
    # shared memory, each would have its own counter and the limit would be
    # multiplied by the number of workers.
    #
    # Syntax: limit_req_zone <key> zone=<name>:<size> rate=<N>r/<unit>
    #
    # $binary_remote_addr: the client IP address in 4-byte binary form (IPv4).
    # More memory-efficient than the string $remote_addr.
    # 1MB of shared memory holds ~16,000 unique IP addresses.

    # In local load tests all 50 VUs share the same IP (127.0.0.1 or the Docker
    # bridge 172.x.x.x), so Nginx groups them together and throttles as one client.
    # In production 50 real users = 50 different IPs — each well under the per-IP limit.
    # geo maps localhost/Docker bridge to an empty key, which Nginx treats as
    # "no zone entry" and skips rate limiting entirely for that IP.
    geo $rate_limit_key {
        default             $binary_remote_addr;
        127.0.0.1           "";   # loopback — local dev / k6 load tests
        172.16.0.0/12       "";   # Docker bridge network (172.17.x.x, 172.18.x.x, etc.)
    }

    # General API rate limit.
    # Production: set this to ~20r/s — protects against DDoS from any single IP.
    # Local dev / load test: 500r/s so the Nginx limiter is never the bottleneck
    # when all 50 k6 VUs share the same source IP (Docker gateway 172.18.0.1).
    # In production, 50 real users = 50 different IPs, each well under 20r/s.
    limit_req_zone $rate_limit_key zone=api_limit:10m    rate=500r/s;

    # Upload endpoint: stricter — AI processing is expensive server-side
    limit_req_zone $rate_limit_key zone=upload_limit:10m rate=2r/s;

    # When limit is hit, return 429 (Too Many Requests) not 503 (Service Unavailable).
    # 429 is semantically correct and lets clients know to back off and retry.
    limit_req_status 429;


    # ── Upstream: the backend FastAPI worker pool ──────────────────────────────
    # "upstream" defines a named group of backend servers Nginx can forward to.
    # This is where load balancing lives.
    upstream docubrain_backend {

        # least_conn: send each new request to the worker with the fewest active
        # connections at that moment.
        #
        # Why not round_robin (the default)?
        # Our endpoints have wildly different latencies:
        #   GET /health         → ~1ms
        #   GET /analytics      → ~50ms (5 SQL aggregate queries)
        #   POST /quiz/generate → ~5000ms (S3 download + Gemini call)
        #
        # With round_robin, a worker that got 3 slow quiz-generation requests
        # (15s of work queued) would keep receiving new requests at the same
        # rate as an idle worker. least_conn avoids this — it sees the queued
        # connections and routes away from the busy worker.
        least_conn;

        # The backend service as named in docker-compose.
        # Docker's internal DNS resolves "backend" to the container's IP.
        server backend:8000;

        # To scale horizontally, add more lines — Nginx picks up config on reload:
        # server backend_2:8000;
        # server backend_3:8000;

        # keepalive: maintain up to N idle persistent connections to the upstream.
        # Without this, Nginx opens a new TCP connection to FastAPI for EVERY
        # request — that's a 3-way TCP handshake + TLS handshake (if using HTTPS
        # internally) on every single request.
        # With keepalive 32: connections are reused. Latency drops measurably.
        keepalive 32;

        # keepalive_requests: max requests per keepalive connection before it's
        # closed and a fresh one opened. Prevents connection rot.
        keepalive_requests 1000;
    }


    # ══════════════════════════════════════════════════════════════════════════
    # HTTP server block — handles all traffic on port 80
    # In dev: proxies directly to FastAPI
    # In production: should redirect to HTTPS (see commented block at bottom)
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;   # "_" = catch-all; replace with "docubrain.com" in prod

        # ── Security headers ──────────────────────────────────────────────────
        # These instruct the browser to apply additional protections.
        # "always" means: add the header even on error responses (4xx, 5xx).

        # Prevent MIME-type sniffing: browser must use the declared Content-Type.
        # Without this, a browser might interpret a JSON file as HTML and execute
        # embedded <script> tags — a classic XSS vector.
        add_header X-Content-Type-Options  "nosniff"       always;

        # Prevent your page from being embedded in an iframe on another domain.
        # Stops "clickjacking" attacks where an attacker overlays your UI.
        add_header X-Frame-Options         "DENY"          always;

        # Legacy browser XSS filter. Belt-and-suspenders alongside CSP.
        add_header X-XSS-Protection        "1; mode=block" always;

        # Control what information is sent in the Referer header when linking out.
        # "strict-origin" sends only the origin (not full URL) for cross-origin.
        add_header Referrer-Policy         "strict-origin" always;


        # ── Block /metrics from the public internet ───────────────────────────
        # /metrics is Prometheus's scrape endpoint — it exposes internal data
        # (error rates, endpoint latencies, active connections) that would let
        # an attacker map your system's internals.
        # Prometheus scrapes from INSIDE your infra network — never from outside.
        # Return 403 immediately; Nginx doesn't even contact FastAPI.
        location = /metrics {
            return 403 "Forbidden";
        }


        # ── Health check — no rate limit ──────────────────────────────────────
        # Monitoring systems (uptime robots, k8s probes, load balancer health checks)
        # must always be able to reach /health. A rate limit here would cause
        # your monitoring to report false outages.
        location = /health {
            proxy_pass         http://docubrain_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }


        # ── WebSocket endpoints (/ws/) ────────────────────────────────────────
        # WebSocket (RFC 6455) starts as a normal HTTP/1.1 request with:
        #   Connection: Upgrade
        #   Upgrade: websocket
        #
        # By default, Nginx strips hop-by-hop headers like "Connection" and
        # "Upgrade" before forwarding — the backend never sees the upgrade request
        # and the WebSocket handshake silently fails (client gets a 200 instead
        # of 101 Switching Protocols, and the connection drops).
        #
        # These two lines explicitly forward the upgrade headers:
        location /ws/ {
            proxy_pass         http://docubrain_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;   # "websocket"
            proxy_set_header   Connection "upgrade";       # tell backend to upgrade
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket connections are long-lived (minutes to hours).
            # Default proxy_read_timeout is 60s — would kill idle WS connections.
            # 1 hour gives enough headroom; client heartbeats keep them alive.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ── Upload endpoint — stricter rate limit + larger body ───────────────
        location /documents/upload {
            # burst=3: allow a short burst of 3 queued requests before rejecting.
            # nodelay: serve the burst immediately (don't space them out over time).
            limit_req zone=upload_limit burst=3 nodelay;

            # client_max_body_size: maximum request body Nginx accepts.
            # Default is 1MB — tiny. PDFs can be tens of megabytes.
            # This must be >= the limit enforced in FastAPI's upload handler.
            client_max_body_size 50M;

            # Uploading a large PDF + sending it to S3 + dispatching Celery task
            # can take 10-30 seconds. Give it 2 minutes before timing out.
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_connect_timeout 10s;

            proxy_pass         http://docubrain_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
        }


        # ── All other routes — general API ────────────────────────────────────
        location / {
            # burst=500: sized to match the 500r/s zone above for local load tests.
            # nodelay: don't throttle the burst; serve it immediately.
            limit_req zone=api_limit burst=500 nodelay;

            client_max_body_size 10M;

            # Timeouts:
            # proxy_connect_timeout — max time to open a TCP connection to upstream
            # proxy_send_timeout    — max time between two successive sends to upstream
            # proxy_read_timeout    — max time to wait for upstream's next response chunk
            # Most AI endpoints (chat streaming, quiz gen) are under 60s.
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_pass         http://docubrain_backend;
            proxy_http_version 1.1;

            # Clear the Connection header so HTTP/1.1 keepalive works upstream.
            # HTTP/1.0 sends "Connection: close" by default; we must override it.
            proxy_set_header Connection "";

            # X-Real-IP: the direct client IP (before any proxy chain).
            # X-Forwarded-For: the full proxy chain, appended by each proxy.
            # FastAPI's rate limiter should use X-Forwarded-For to get the real IP.
            # $proxy_add_x_forwarded_for appends $remote_addr to any existing value,
            # handling the case where the client itself is behind another proxy.
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header Host               $host;

            # Buffering: Nginx reads the ENTIRE response from FastAPI into its
            # buffer, ACKs FastAPI, releases the FastAPI worker connection, THEN
            # slowly streams the buffer to the client.
            #
            # Without this: if a client has a slow 1Mbps connection and downloads
            # a 500KB JSON response at 500ms, the FastAPI worker is blocked for
            # 500ms holding that connection open — even though its work is done.
            # With buffering: FastAPI dumps the response in ~1ms, worker is freed,
            # Nginx handles the slow client on its own.
            #
            # Exception: SSE/streaming endpoints — buffering breaks them because
            # you WANT to flush chunks immediately. Those endpoints set
            # X-Accel-Buffering: no in their response headers to opt out.
            proxy_buffering    on;
            proxy_buffer_size  4k;     # buffer for response headers
            proxy_buffers      8 8k;   # 8 buffers × 8KB = 64KB for response body
        }
    }


    # ══════════════════════════════════════════════════════════════════════════
    # HTTPS server block — uncomment for production TLS
    #
    # How to get a free certificate (Let's Encrypt):
    #   1. Point your domain DNS to this server
    #   2. Run: docker run -it --rm -p 80:80 \
    #             -v /etc/letsencrypt:/etc/letsencrypt \
    #             certbot/certbot certonly --standalone -d yourdomain.com
    #   3. Certificates appear at /etc/letsencrypt/live/yourdomain.com/
    #   4. Mount that directory in docker-compose (see nginx service volumes)
    #   5. Uncomment the block below and change the HTTP block to redirect:
    #        location / { return 301 https://$host$request_uri; }
    # ══════════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    #
    #     # Only TLS 1.2 and 1.3 — drop broken older protocols (TLS 1.0/1.1, SSL 3)
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     # ECDHE cipher suites provide Forward Secrecy:
    #     # Each session generates a unique ephemeral key pair. Even if an attacker
    #     # records your traffic TODAY and steals your private key LATER, they
    #     # cannot decrypt past sessions — there's no key to steal.
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     # HSTS (HTTP Strict Transport Security):
    #     # Tells the browser: "For the next year, ALWAYS use HTTPS for this domain.
    #     # If you receive an HTTP response, ignore it." Prevents SSL stripping attacks.
    #     # WARNING: Once set, you CANNOT go back to HTTP for max-age seconds.
    #     # Start with a short max-age (300) for testing, then increase to 31536000.
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # TLS session cache: reuse TLS handshake parameters for returning clients.
    #     # A full TLS 1.3 handshake costs ~2 round trips. A resumed session costs 0.
    #     # 10MB shared cache holds ~40,000 sessions.
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;  # Disable tickets (forward secrecy concern)
    #
    #     # OCSP Stapling: Nginx pre-fetches the certificate revocation status
    #     # from the CA and includes it in the TLS handshake. Without this, the
    #     # browser must make a separate HTTP request to the CA to check if your
    #     # certificate is revoked — adding latency to every new connection.
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     resolver 8.8.8.8 1.1.1.1 valid=300s;
    #
    #     # ... same location blocks as HTTP server above ...
    # }
}
