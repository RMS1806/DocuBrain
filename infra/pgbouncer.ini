;
; PgBouncer configuration for DocuBrain
;
; In Docker (docker-compose), this file is NOT used directly —
; the edoburu/pgbouncer image generates it from environment variables.
; This file is the reference config for bare-metal / VM deployments.
;
; Deploy: cp pgbouncer.ini /etc/pgbouncer/pgbouncer.ini
;         systemctl restart pgbouncer
;

[databases]
; Alias "docubrain" → real Postgres host/db
; Your app connects to pgbouncer:5432/docubrain
; PgBouncer transparently forwards to postgres-host:5432/actual_db_name
docubrain = host=127.0.0.1 port=5432 dbname=docubrain


[pgbouncer]

; ── Network ──────────────────────────────────────────────────────────────────
listen_addr   = 0.0.0.0     ; Accept connections from any network interface
listen_port   = 5432         ; Same port as Postgres so apps need no reconfiguration
unix_socket_dir =            ; Disable UNIX sockets (we use TCP only)

; ── Auth ─────────────────────────────────────────────────────────────────────
; md5: PgBouncer checks the password against userlist.txt (MD5 hashed)
; For production, prefer "scram-sha-256" (requires PgBouncer 1.18+).
auth_type     = md5
auth_file     = /etc/pgbouncer/userlist.txt

; ── Pooling ───────────────────────────────────────────────────────────────────
; "transaction" mode: a real Postgres connection is borrowed for the duration
; of one transaction (BEGIN … COMMIT), then returned to the pool.
; This is the best balance of performance and compatibility.
;
; WARNING: transaction mode is incompatible with:
;   - SET/RESET (session-level state)
;   - LISTEN/NOTIFY
;   - Advisory locks that span transactions
; None of these are used in DocuBrain.
pool_mode = transaction

; max_client_conn: how many simultaneous connections PgBouncer will accept
; from your application. This is cheap — PgBouncer handles them with a single
; OS process and minimal memory per client.
max_client_conn = 200

; default_pool_size: the number of REAL Postgres connections PgBouncer maintains.
; This is the number that matters for Postgres's max_connections limit.
; Rule of thumb: 2-4× the number of CPU cores on your Postgres server.
; Render free tier has 1 vCPU → 10 is comfortable.
default_pool_size = 10

; min_pool_size: keep at least this many real connections open at all times.
; Avoids cold-start latency when a burst of requests arrives after an idle period.
min_pool_size = 2

; reserve_pool_size: extra connections available when pool is exhausted.
; These are only opened under load and closed when load drops.
reserve_pool_size = 3
reserve_pool_timeout = 3    ; seconds to wait before using reserve

; ── Timeouts ──────────────────────────────────────────────────────────────────
; server_idle_timeout: close a real Postgres connection after this many seconds idle.
; Frees resources on the Postgres side during quiet periods.
server_idle_timeout = 600   ; 10 minutes

; client_idle_timeout: close a client connection (from your app) after idle.
; 0 = no timeout. Your SQLAlchemy pool_recycle handles this from the app side.
client_idle_timeout = 0

; query_timeout: hard cap on any single query. 0 = no limit.
; Set this to catch runaway queries in production.
query_timeout = 30          ; 30 seconds

; ── Logging ───────────────────────────────────────────────────────────────────
log_connections    = 1
log_disconnections = 1
log_pooler_errors  = 1

; ── Admin interface ───────────────────────────────────────────────────────────
; Connect to "pgbouncer" pseudo-database to run SHOW POOLS, SHOW STATS, RELOAD, etc.
; Example: psql -h 127.0.0.1 -p 5432 -U pgbouncer pgbouncer
admin_users = pgbouncer
stats_users = pgbouncer

;
; userlist.txt format (place at /etc/pgbouncer/userlist.txt):
;
;   "username" "md5<md5(password + username)>"
;
; Generate the hash in Python:
;   import hashlib
;   user, pw = "myuser", "mypassword"
;   h = hashlib.md5((pw + user).encode()).hexdigest()
;   print(f'"{ user }" "md5{h}"')
;
